name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ci-check]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
      - name: Print finding locations for diagnosis
        if: always()
        shell: bash
        run: |
          find sarif-results -type f -name '*.sarif' -print0 | while IFS= read -r -d '' file; do
            jq -r '.runs[]?.results[]? | [.ruleId, (.locations[0].physicalLocation.artifactLocation.uri // "unknown"), ((.locations[0].physicalLocation.region.startLine // 0) | tostring)] | @tsv' "$file"
          done
