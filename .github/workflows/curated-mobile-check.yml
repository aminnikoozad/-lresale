name: Curated Mobile Check

on:
  push:
    branches: [curated-quality-message]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build application
        run: npm run build
      - name: Start application
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > home.html; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Verify storefront routes and content
        run: |
          grep -F "Boutique-quality secondhand, hand-inspected — not thrift-store luck." home.html
          grep -F "Like Marketplace, without the work." home.html
          grep -F "Our quality promise" home.html
          curl --fail --silent http://127.0.0.1:3000/cart > cart.html
          ITEM_PATH=$(grep -oE 'href="/item/[0-9a-f-]{36}"' home.html | head -n 1 | cut -d'"' -f2 || true)
          echo "item_path=$ITEM_PATH" | tee item-path.txt
          if [ -n "$ITEM_PATH" ]; then
            curl --fail --silent "http://127.0.0.1:3000$ITEM_PATH" > product.html
          fi
      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Capture homepage at 390px
        run: npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000/ home-390.png
      - name: Capture product at 390px when available
        run: |
          ITEM_PATH=$(cut -d= -f2- item-path.txt)
          if [ -n "$ITEM_PATH" ]; then
            npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page "http://127.0.0.1:3000$ITEM_PATH" product-390.png
          else
            echo "No listed item available; PDP capture skipped."
          fi
      - name: Upload mobile verification
        uses: actions/upload-artifact@v4
        with:
          name: curated-mobile-verification
          path: |
            home-390.png
            product-390.png
            home.html
            product.html
            cart.html
            item-path.txt
            server.log
          if-no-files-found: warn
